services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tocaan-app:latest
    container_name: tocaan_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      CONTAINER_ROLE: app
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tocaan_order_payment}
      DB_USERNAME: ${DB_USERNAME:-tocaan_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - ./:/var/www/html
      - tocaan_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tocaan_network

  webserver:
    image: nginx:1.27-alpine
    container_name: tocaan_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tocaan_network

  queue:
    image: tocaan-app:latest
    container_name: tocaan_queue
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      CONTAINER_ROLE: queue
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tocaan_order_payment}
      DB_USERNAME: ${DB_USERNAME:-tocaan_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - ./:/var/www/html
      - tocaan_vendor:/var/www/html/vendor
    depends_on:
      - app
      - rabbitmq
      - redis
      - db
    networks:
      - tocaan_network

  db:
    image: mysql:8.0
    container_name: tocaan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tocaan_order_payment}
      MYSQL_USER: ${DB_USERNAME:-tocaan_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - tocaan_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tocaan_network

  redis:
    image: redis:7.4-alpine
    container_name: tocaan_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-63790}:6379"
    volumes:
      - tocaan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tocaan_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tocaan_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${FORWARD_RABBITMQ_PORT:-5672}:5672"
      - "${FORWARD_RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - tocaan_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tocaan_network

networks:
  tocaan_network:
    driver: bridge

volumes:
  tocaan_vendor:
  tocaan_db_data:
  tocaan_redis_data:
  tocaan_rabbitmq_data:
